{{- /* Show Cloudflare Edge Location */}}
{{- $label := "Cloudflare edge: " }}
{{- if eq .Lang "zh" }}{{- $label = "Cloudflare 节点：" }}{{- end }}

<span id="cf-colo" class="cf-colo" hidden>{{ $label }}</span>

<style>
  .cf-colo {
    display: block;
    text-align: center;
    font-size: 0.85rem;
    color: var(--secondary);
    margin-bottom: 8px;
  }
</style>

<script>
  (() => {
    const el = document.getElementById('cf-colo');
    if (!el) return;
    const cities = {
      SJC: 'San Jose', LAX: 'Los Angeles', SEA: 'Seattle', ORD: 'Chicago',
      DFW: 'Dallas', IAD: 'Ashburn', EWR: 'Newark', JFK: 'New York', ATL: 'Atlanta',
      YYZ: 'Toronto', YVR: 'Vancouver', GRU: 'Sao Paulo', SCL: 'Santiago',
      LHR: 'London', CDG: 'Paris', FRA: 'Frankfurt', AMS: 'Amsterdam',
      MAD: 'Madrid', MXP: 'Milan', WAW: 'Warsaw', ARN: 'Stockholm',
      HKG: 'Hong Kong', NRT: 'Tokyo', KIX: 'Osaka', ICN: 'Seoul', TPE: 'Taipei',
      SIN: 'Singapore', BKK: 'Bangkok', DXB: 'Dubai', BOM: 'Mumbai', DEL: 'Delhi',
      JNB: 'Johannesburg', SYD: 'Sydney', MEL: 'Melbourne',
      SHA: 'Shanghai', PEK: 'Beijing', CAN: 'Guangzhou', SZX: 'Shenzhen',
      CTU: 'Chengdu', CKG: 'Chongqing', HGH: 'Hangzhou', XIY: "Xi'an",
      WUH: 'Wuhan', NKG: 'Nanjing', TAO: 'Qingdao', CSX: 'Changsha',
      FOC: 'Fuzhou', XMN: 'Xiamen', KMG: 'Kunming', SHE: 'Shenyang', DLC: 'Dalian'
    };
    fetch('/cdn-cgi/trace')
      .then(r => r.text())
      .then(t => {
        const m = t.match(/^colo=(\S+)$/m);
        if (!m) return;
        const city = cities[m[1]] ? ' · ' + cities[m[1]] : '';
        el.textContent += m[1] + city;
        el.hidden = false;
      })
      .catch(() => { el.hidden = true; });
  })();
</script>
