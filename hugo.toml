baseURL = "https://blog.zjackie.ink/"
title = "0x1 ZeroINK"
theme = "PaperMod"

locale = "en-us"
defaultContentLanguage = "en"
timeZone = "Asia/Shanghai"
hasCJKLanguage = true

copyright = "Copyright &copy; 2026 Jackie · Content licensed under [CC BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/)"

enableEmoji = true
enableGitInfo = true

[pagination]
  pagerSize = 10

[permalinks]
  posts = "/posts/:slug/"
  share = "/share/:slug/"
  research = "/research/:slug/"

[outputs]
  home = ["HTML", "RSS", "JSON", "WebAppManifest", "llms"]

[mediaTypes]
  [mediaTypes."application/manifest+json"]
    suffixes = ["webmanifest"]

[outputFormats]
  [outputFormats.WebAppManifest]
    mediaType = "application/manifest+json"
    baseName = "site"
    isPlainText = true
    notAlternative = true
  [outputFormats.llms]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true

[languages]
  [languages.en]
    locale = "en-us"
    label = "English"
    title = "0x1 ZeroINK"
    [languages.en.params]
      description = "Jackie's thoughts and research on cryptocurrency, privacy, and open source."
      [languages.en.params.homeInfoParams]
        Title = "Welcome to ZeroINK"
        Content = "Jackie's thoughts and research on cryptocurrency, privacy, and open source."
    [[languages.en.menu.main]]
      identifier = "share"
      name = "Share"
      url = "/share/"
      weight = 10
    [[languages.en.menu.main]]
      identifier = "research"
      name = "Research"
      url = "/research/"
      weight = 20
    [[languages.en.menu.main]]
      identifier = "tags"
      name = "Tags"
      url = "/tags/"
      weight = 30
    [[languages.en.menu.main]]
      identifier = "archives"
      name = "Archives"
      url = "/archives/"
      weight = 40
    [[languages.en.menu.main]]
      identifier = "search"
      name = "Search"
      url = "/search/"
      weight = 50

  [languages.zh]
    locale = "zh-cn"
    label = "简体中文"
    title = "0x1 ZeroINK"
    [languages.zh.params]
      description = "Jackie 关于加密货币、隐私与开源的思考与研究。"
      [languages.zh.params.homeInfoParams]
        Title = "欢迎来到 ZeroINK"
        Content = "Jackie 关于加密货币、隐私与开源的思考与研究。"
    [languages.zh.params.editPost]
      URL = "https://github.com/PyXMR2025/0x1-ZeroINK/edit/main/content"
      Text = "建议修改"
      appendFilePath = true
    [[languages.zh.menu.main]]
      identifier = "share"
      name = "分享"
      url = "/share/"
      weight = 10
    [[languages.zh.menu.main]]
      identifier = "research"
      name = "研究"
      url = "/research/"
      weight = 20
    [[languages.zh.menu.main]]
      identifier = "tags"
      name = "标签"
      url = "/tags/"
      weight = 30
    [[languages.zh.menu.main]]
      identifier = "archives"
      name = "归档"
      url = "/archives/"
      weight = 40
    [[languages.zh.menu.main]]
      identifier = "search"
      name = "搜索"
      url = "/search/"
      weight = 50

[params]
  env = "production"
  description = "Jackie's thoughts and research on cryptocurrency, privacy, and open source."
  author = "Jackie"
  images = ["images/default/og-default.png"]
  mainSections = ["posts", "share", "research"]

  defaultTheme = "auto"
  disableThemeToggle = false
  displayFullLangName = true

  ShowReadingTime = true
  ShowWordCount = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true

  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = true
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false

  [params.editPost]
    URL = "https://github.com/PyXMR2025/0x1-ZeroINK/edit/main/content"
    Text = "Suggest Changes"
    appendFilePath = true

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/PyXMR2025"

  [[params.socialIcons]]
    name = "x"
    url = "https://x.com/PyXMR2025"

  [[params.socialIcons]]
    name = "matrix"
    url = "https://matrix.to/#/@pyxmr2025:mozilla.org"

  [[params.socialIcons]]
    name = "orcid"
    url = "https://orcid.org/0009-0005-9010-4173"

  [[params.socialIcons]]
    name = "hackerone"
    url = "https://hackerone.com/ohyijia"

  [[params.socialIcons]]
    name = "rss"
    url = "https://blog.zjackie.ink/index.xml"

[markup]
  [markup.highlight]
    anchorLineNos = true
    codeFences = true
    guessSyntax = true
    lineNos = true
    style = "monokai"
  [markup.goldmark.renderer]
    unsafe = true

[taxonomies]
  tag = "tags"
  category = "categories"
