baseURL = "https://blog.zjackie.ink/"
title = "0x1 ZeroINK"
theme = "PaperMod"

locale = "en-us"
defaultContentLanguage = "en"
hasCJKLanguage = true

copyright = "Copyright &copy; 2026 Jackie"

enableEmoji = true
enableGitInfo = true

[pagination]
  pagerSize = 10

[permalinks]
  posts = "/posts/:slug/"

[outputs]
  home = ["HTML", "RSS", "JSON", "WebAppManifest"]

[mediaTypes]
  [mediaTypes."application/manifest+json"]
    suffixes = ["webmanifest"]

[outputFormats]
  [outputFormats.WebAppManifest]
    mediaType = "application/manifest+json"
    baseName = "site"
    isPlainText = true
    notAlternative = true

[languages]
  [languages.en]
    locale = "en-us"
    label = "English"
    title = "0x1 ZeroINK"
    [languages.en.params]
      description = "Jackie's notes on security, open source, and programming — plus privacy and hacker culture; daily posts, essays, and research papers."
      [languages.en.params.homeInfoParams]
        Title = "Welcome to ZeroINK"
        Content = "Jackie's notes on security, open source, and programming — plus privacy and hacker culture"
    [[languages.en.menu.main]]
      identifier = "posts"
      name = "Posts"
      url = "/posts/"
      weight = 10
    [[languages.en.menu.main]]
      identifier = "tags"
      name = "Tags"
      url = "/tags/"
      weight = 20
    [[languages.en.menu.main]]
      identifier = "archives"
      name = "Archives"
      url = "/archives/"
      weight = 30
    [[languages.en.menu.main]]
      identifier = "search"
      name = "Search"
      url = "/search/"
      weight = 40

  [languages.zh]
    locale = "zh-cn"
    label = "简体中文"
    title = "0x1 ZeroINK"
    [languages.zh.params]
      description = "Jackie 关于安全、开源与编程的笔记，兼谈隐私与极客文化——每日分享、思考长文与研究论文。"
      [languages.zh.params.homeInfoParams]
        Title = "欢迎来到 ZeroINK"
        Content = "Jackie 关于安全、开源与编程的笔记，兼谈隐私与极客文化"
    [[languages.zh.menu.main]]
      identifier = "posts"
      name = "文章"
      url = "/posts/"
      weight = 10
    [[languages.zh.menu.main]]
      identifier = "tags"
      name = "标签"
      url = "/tags/"
      weight = 20
    [[languages.zh.menu.main]]
      identifier = "archives"
      name = "归档"
      url = "/archives/"
      weight = 30
    [[languages.zh.menu.main]]
      identifier = "search"
      name = "搜索"
      url = "/search/"
      weight = 40

[params]
  env = "production"
  description = "Jackie's personal blog"
  author = "Jackie"

  defaultTheme = "auto"
  disableThemeToggle = false
  displayFullLangName = true

  ShowReadingTime = true
  ShowWordCount = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true

  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false

  [params.editPost]
    URL = "https://github.com/PyXMR2025/0x1-ZeroINK/edit/main/content"
    Text = "Suggest Changes"
    appendFilePath = true

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/PyXMR2025/0x1-ZeroINK"

  [[params.socialIcons]]
    name = "rss"
    url = "https://blog.zjackie.ink/index.xml"

[markup]
  [markup.highlight]
    anchorLineNos = true
    codeFences = true
    guessSyntax = true
    lineNos = true
    style = "monokai"
  [markup.goldmark.renderer]
    unsafe = true

[taxonomies]
  tag = "tags"
  category = "categories"
